experiment_config:
  seed: [ 42 ]
  device: "cuda"
  train_model: 1
  local_eval: 1
  global_eval: 1
  save_model: 1
  model_path: './models/target/'
  model_name: 'AlexNet'
---
attack_settings:
  passive_attack: 0
  stable_in: 1
  normal_training: 1
  active_attack: 1
  start_index: [20,300]
  eval_attack: 1
  save_attack_model: 10
  attack_data_target_overlap_with: 'all'
  train_batch_size: 64
  test_batch_size: 64
  attack_loss_function: 'MSELoss'
  attack_optimizer: 'Adam'
  active_learning_rate: 0.0001
  attack_data_distribution: [2000, 2000, 2000, 2000]
  observed_target_models: [47, 48, 49, 50]
  attack_model_path: './models/attack/'
  attack_local_epoch: 10
  attack_model_learning_rate: 0.0001
  is_gradient_ascent: 0
  save_information_count: 50
  backdoor_way: 0
  backdoor_epoch: 10
  is_plot: 0
  chosemaxdiff: 0
  a_b_ab: 0 #1 is member,2 is nonmember,0 is all
  maxdiff: [5,60,5]
  other_training: 0
---
training_settings:
  local_epoch: 10
  number_of_clients: 10
  proportion_clients: 1
  client_data_overlap: 0
  fixed_dataset: 0
  dataset_size: 30000
  training_rounds: 300
  learning_rate: 0.01
  momentum: 0.9
  weight_decay: 0.0005
  adjust_lr_at_: [50, 100]
  train_batch_size: 64
  test_batch_size: 64
  loss_function: 'CrossEntropyLoss'
  optimizer: 'SGD'
  is_iid: 0
  no_iid_class_num: 70
---
data_settings:
  data_path: "./data/"
  dataset_name: "cifar-100-python"
  number_of_classes: 100
---
LOG_settings:
  log_path: "./log/"
  log_level: "INFO"
---
backdoor_settings:
  is_sga: 0
  is_poison: 1
  is_train: 1
  back_rounds: 1
  back_prop: 1
  test_back_prop: 0.5
  noise_percentage: 0.01
  probability_threshold: 0.9
  max_iteration: 1
  target: 5
  patch_lr: 0.01
  patch_type: "rectangle"
  log_dir: "patch_attack_log.csv"





