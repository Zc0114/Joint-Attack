experiment_config:
  seed: [ 42 ]
  device: "cuda"
  train_model: 1                                                       #是否进行联邦学习训练
  local_eval: 1                                                        #多久评估全局模型
  global_eval: 1                                                       #多久评估一次本地模型
  save_model: 5
  model_path: './fashion_mnist/changeinterval/0-1.normal_client15_backdoor0_lr0.00002_epoch3_1_1_0.1'   #会创建一个目录里面会保存各种文件
  model_name: 'CNNModel'                                                 #模型名
---
attack_settings:
  passive_attack: 1                                                    #是否进行成员推理攻击
  stable_in: 1                                                         #攻击者是否一直被选中
  normal_training: 1                                                   #攻击者是否正常训练
  active_attack: 1                                                     #主动攻击的间隔轮数
  start_index: [10,200]                                                 #主动攻击的开始轮数和结束轮数
  eval_attack: 1                                                       #多久评估一次攻击模型性能既成员推理结果（建议是1）可能画图
  save_attack_model: 1                                                #多久保存一次成员推理模型
  attack_data_target_overlap_with: 'all'             
  train_batch_size: 64                   # F-MNIST attack/backdoor batch size
  test_batch_size: 64                    # F-MNIST attack evaluation batch size
  attack_loss_function: 'MSELoss'      
  attack_optimizer: 'Adam'            
  active_learning_rate: 0.00002                                         #主动攻击既梯度上升，或后门攻击时，修改本地模型时所用的学习率，梯度上升时不应该太高
  attack_data_distribution: [1500, 1500, 1500, 1500]                       #成员推理使用的辅助数据集大小
  observed_target_models: [30,70,100]
  attack_model_path: './models/attack/'
  attack_local_epoch: 3                                                 #梯度上升时进行的轮数
  attack_model_learning_rate: 0.0002                                     # attack-model Adam learning rate
  is_gradient_ascent: 0                                                 #是否进行梯度上升1进行0不进行
  save_information_count: 50                                            #多久显示一次成员推理信息
  backdoor_way: 0                                                       
  a_b_ab: 3
  backdoor_epoch: 3                                                     #后门攻击时进行的轮数
  is_plot: 0
  chosemaxdiff: 0
  maxdiff: [5,300,5]
  other_training: 0
  poison_dataset: 0
  ratio: 0                                                           #论文未明确该代码专用子集比例，保留原值
  
---
training_settings:
  local_epoch: 3                                                        #本地模型训练轮数
  number_of_clients: 15                                                  #客户端数量
  proportion_clients: 1                                                 #每次选择客户端比例
  client_data_overlap: 0                                                
  fixed_dataset: 0                                                  
  dataset_size: 30000                                                   
  training_rounds: 100                                                  #一共进行多少轮
  learning_rate: 0.01                                                   #本地模型学习率
  momentum: 0.9
  weight_decay: 0.0005
  adjust_lr_at_: [50,100]                                                #调整学习率的轮数，每次都缩小十倍
  train_batch_size: 64
  test_batch_size: 64
  loss_function: 'CrossEntropyLoss'
  optimizer: 'SGD'
  is_iid: 1                                                             #本地模型的数据是否是iid的，是1不是0
  no_iid_class_num: 5                                                   #非iid情况下 所拥有的类别数（根据客户数可能会存在不能均分的情况，但会尽可能保证均分）
---
data_settings:
  data_path: "./data/"
  dataset_name: "fashion_mnist"
  number_of_classes: 10
---
LOG_settings:
  log_path: "./fashion_mnist/log/"
  log_level: "INFO"
---
backdoor_settings:
  is_sga: 0
  is_poison: 1                                                          #论文联合攻击开启后门训练
  is_train: 1                                                           #论文联合攻击训练动态触发器
  back_rounds: 10                                                        #训练patch时的轮数
  back_prop: 0.01                                                       #Table 2: train poisoning rate
  test_back_prop: 0.5                                                   #Table 2: test poisoning rate
  noise_percentage: 0.01                                                 #28x28 image => 2x2 rectangle
  probability_threshold: 0.8                                            #生成触发器时触发器有效时的界限
  max_iteration: 10                                                     #生成触发器时的最大轮数                                                  #
  target: 5                                                             #攻击者所期望分成的类别
  patch_lr: 0.01                                                        #触发器的大小
  patch_type: "rectangle"
  log_dir: "patch_attack_log.csv"
  use_mialoss_ratio: 1                                                  #将成员推理损失添加到更新触发器时所占的比例（0-1）
  mia_back_rounds: 1

